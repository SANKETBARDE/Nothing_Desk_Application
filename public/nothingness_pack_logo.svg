<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Nothingness Icon Pack Logo</title>
  <desc>Signature frosted glass slashes logo of the Nothingness icon pack.</desc>
  <defs>
    <!-- Base smoked glass gradient -->
    <linearGradient id="logo-squircle-bg" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#565660"/>
      <stop offset="28%" stop-color="#3c3c44"/>
      <stop offset="65%" stop-color="#212126"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>

    <!-- Specular light sheen on top-left of glass tile -->
    <radialGradient id="logo-specular" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Beveled glass rim stroke -->
    <linearGradient id="logo-rim-stroke" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Frosted glass slash fill gradient -->
    <linearGradient id="slash-glass" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ededf5" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#c8c8d2" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Soft ambient shadow -->
    <filter id="slash-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Smoked Glass Squircle Base -->
  <rect width="1024" height="1024" rx="260" fill="url(#logo-squircle-bg)"/>
  <rect width="1024" height="1024" rx="260" fill="url(#logo-specular)"/>
  <rect width="1024" height="1024" rx="260" fill="none" stroke="url(#logo-rim-stroke)" stroke-width="12"/>

  <!-- Iconic Nothingness Dual Slashes // -->
  <g filter="url(#slash-shadow)">
    <!-- First slash -->
    <rect x="300" y="260" width="160" height="504" rx="80" transform="skewX(-26)" transform-origin="380 512" fill="url(#slash-glass)"/>
    <!-- Second slash -->
    <rect x="520" y="260" width="160" height="504" rx="80" transform="skewX(-26)" transform-origin="600 512" fill="url(#slash-glass)"/>
  </g>
</svg>
